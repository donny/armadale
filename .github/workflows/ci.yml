name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Armadale targets macOS 27 and needs Xcode 27 / Swift 6.4. `xcode-27` is
    # GitHub's macOS 27 + Xcode 27 image (public preview as of 2026-10; see
    # https://github.com/actions/runner-images/issues/14404). `macos-latest`
    # and `macos-26` only carry Xcode 26.x. Switch to a `macos-27` label once
    # GitHub publishes one as GA.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pinned to the Xcode build the project is developed with (27A266a).
      XCODE_APP: /Applications/Xcode_27.app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not installed on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27\.' || { echo "::error::Expected Xcode 27"; exit 1; }
          sw_vers
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # SwiftTerm ships a build-tool plugin; CI cannot click "Trust & Enable",
      # so plugin validation is skipped on the command line. Package versions
      # come only from the committed
      # Armadale.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved.
      - name: Build and test (app + all package test targets)
        run: |
          xcodebuild \
            -project Armadale.xcodeproj \
            -scheme Armadale \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            build test

      - name: swift test (ArmadaleCore)
        working-directory: Packages/ArmadaleCore
        run: swift test
