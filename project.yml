# XcodeGen spec for Armadale. Generate the project with `xcodegen generate`;
# Armadale.xcodeproj is a build artefact and is git-ignored.
name: Armadale

options:
  bundleIdPrefix: com.tinylittleapps
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"            # Swift 6 language mode
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ArmadaleCore:
    path: Packages/ArmadaleCore
  ArmadaleSessions:
    path: Packages/ArmadaleSessions
  TerminalSurface:
    path: Packages/TerminalSurface
  SwiftTermSurface:
    path: Packages/SwiftTermSurface

targets:
  Armadale:
    type: application
    platform: macOS
    sources:
      - path: Armadale
        excludes:
          - Resources/armadale-notify
      # The notify helper agents' hooks can run (docs/DESIGN.md section 10):
      # Contents/Resources/armadale-notify, a POSIX sh script (executable).
      - path: Armadale/Resources/armadale-notify
        buildPhase: resources
    info:
      path: Armadale/Resources/Info.plist
      properties:
        CFBundleDisplayName: Armadale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 Donny Kurniawan.\nAll rights reserved."
        NSPrincipalClass: ArmadaleApplication
        # Quitting must go through applicationWillTerminate so state is saved.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Tabs and tab groups dragged in the tab bar and the sidebar
        # (Armadale/Support/HierarchyDragItem.swift). Private to the app.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tinylittleapps.armadale.hierarchy-item
            UTTypeDescription: Armadale tab or tab group
            UTTypeConformsTo:
              - public.data
    # No App Sandbox, by design (docs/DESIGN.md, "Distribution"): Armadale
    # spawns the user's login shell and arbitrary agents with full access to
    # their files, runs a private zmx helper copied to
    # ~/Library/Application Support/Armadale/bin, and drives the user's own
    # `ssh` with their ~/.ssh config, keys and agent. None of that works
    # inside the sandbox. Distribution is Developer ID + notarization with the
    # hardened runtime instead.
    entitlements:
      path: Armadale/Resources/Armadale.entitlements
      properties:
        com.apple.security.app-sandbox: false
    # Bundles zmx before the Copy Files phases (docs/DESIGN.md section 4,
    # "Bundling"): a universal Contents/Helpers/zmx re-signed like ctty-exec,
    # and the Linux builds as data in Contents/Resources/remote/. Verifies
    # Vendor/zmx against scripts/zmx.lock first (fetching it if needed).
    preBuildScripts:
      - name: Embed zmx
        script: '"${SRCROOT}/scripts/embed-zmx.sh"'
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/scripts/embed-zmx.sh
          - $(SRCROOT)/scripts/fetch-zmx.sh
          - $(SRCROOT)/scripts/zmx.lock
          - $(SRCROOT)/Vendor/zmx/macos-aarch64/zmx
          - $(SRCROOT)/Vendor/zmx/macos-x86_64/zmx
          - $(SRCROOT)/Vendor/zmx/linux-aarch64/zmx
          - $(SRCROOT)/Vendor/zmx/linux-x86_64/zmx
        outputFiles:
          - $(DERIVED_FILE_DIR)/zmx
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/zmx
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remote/zmx-linux-aarch64
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remote/zmx-linux-x86_64
    dependencies:
      - package: ArmadaleCore
      - package: ArmadaleSessions
      - package: TerminalSurface
      - package: SwiftTermSurface
      # Copy Files phase: Contents/Helpers/ctty-exec, re-signed on copy with
      # the app's identity (docs/DESIGN.md section 4, "Bundling").
      - target: ctty-exec
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Armadale
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale
        # App icon: Resources/AppIcon.icon (Icon Composer document, used on
        # macOS 26 and later) and the AppIcon set in Resources/Assets.xcassets
        # (rasters for everything else). Both are generated by
        # scripts/render-app-icon.swift; edit the script, not the files.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The "Embed zmx" phase is this target's only script phase, and it
        # cannot run sandboxed: codesign writes a temporary file next to the
        # helper, and fetch-zmx.sh (when Vendor/zmx does not verify) downloads
        # and writes Vendor/zmx. Its inputs and outputs are still declared
        # for dependency analysis.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 9
        # Signing (docs/DESIGN.md section 11, "Release pipeline"). Manual
        # style throughout, so Xcode never reaches for an account or a
        # provisioning profile. Debug is "Sign to Run Locally" (ad hoc), so
        # the build and test gate never needs the keychain; Xcode then turns
        # the hardened runtime off by itself. Release (what `xcodebuild
        # archive` and scripts/release.sh build) signs with the team's
        # Developer ID Application certificate, hardened runtime and a
        # secure timestamp, as notarization requires. The Embed zmx phase
        # and the sign-on-copy of ctty-exec follow this identity.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Our own code must be warning-free. Packages enable the same via
        # `.treatAllWarnings(as: .error)`; third-party SwiftTerm is not affected.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp

  # The trampoline that gives spawned sessions their controlling terminal
  # (docs/DESIGN.md section 7). Same source as the SwiftPM executable target
  # in Packages/ArmadaleSessions, which `swift test` uses.
  ctty-exec:
    type: tool
    platform: macOS
    sources:
      - path: Packages/ArmadaleSessions/Sources/ctty-exec
    settings:
      base:
        PRODUCT_NAME: ctty-exec
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale.ctty-exec
        # An Info.plist section in the binary gives the helper a stable code
        # signing identifier (its bundle ID) instead of a hash-suffixed name.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # No entitlements at all. Xcode would otherwise inject base
        # entitlements (get-task-allow) and, because it considers
        # entitlements required, com.apple.application-identifier: a restricted
        # entitlement that, without a provisioning profile, can make AMFI
        # refuse to launch the helper under Developer ID, so every session
        # would fail to start. Sign-on-copy preserves whatever is here.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENTITLEMENTS_REQUIRED: NO
        # Signed like the app (Debug ad hoc, Release Developer ID with the
        # hardened runtime and a timestamp); the sign-on-copy into
        # Contents/Helpers re-signs it with the app's identity and keeps
        # these flags.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp

  # Tests for the app target's own code (split tree view, close-risk rule,
  # window controller lifetime). Unhosted on purpose: the app is never
  # launched, so no window appears, no state file is read or written, and no
  # session daemon is started. The app's sources are compiled into the
  # bundle instead (all but main.swift).
  ArmadaleAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ArmadaleAppTests
      - path: Armadale
        excludes:
          - App/main.swift
          - Resources/**
    dependencies:
      - package: ArmadaleCore
      - package: ArmadaleSessions
      - package: TerminalSurface
      - package: SwiftTermSurface
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale.app-tests
        GENERATE_INFOPLIST_FILE: YES
        # Not the app's Info.plist (XcodeGen would pick it up from the
        # sources): its NSPrincipalClass makes xctest create a second
        # NSApplication.
        INFOPLIST_FILE: ""
        # Always ad hoc: the bundle is only ever built for the Debug test
        # run and never ships, so it never needs the keychain.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  Armadale:
    build:
      targets:
        Armadale: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # Tests live in the local packages; this makes
      # `xcodebuild test -scheme Armadale` run all of them.
      targets:
        - ArmadaleAppTests
        - package: ArmadaleCore/ArmadaleCoreTests
        - package: ArmadaleSessions/ArmadaleSessionsTests
        - package: TerminalSurface/TerminalSurfaceTests
        - package: SwiftTermSurface/SwiftTermSurfaceTests
    archive:
      config: Release
