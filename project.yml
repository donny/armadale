# XcodeGen spec for Armadale. Generate the project with `xcodegen generate`;
# Armadale.xcodeproj is a build artefact and is git-ignored.
name: Armadale

options:
  bundleIdPrefix: com.tinylittleapps
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"            # Swift 6 language mode
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ArmadaleCore:
    path: Packages/ArmadaleCore
  ArmadaleSessions:
    path: Packages/ArmadaleSessions
  TerminalSurface:
    path: Packages/TerminalSurface
  SwiftTermSurface:
    path: Packages/SwiftTermSurface
  # The updater (docs/DESIGN.md section 8, "Updates"): one binary target, the
  # XCFramework of Sparkle's GitHub release, checksum in its Package.swift.
  # Pinned in Armadale.xcodeproj/.../Package.resolved like every package.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Armadale:
    type: application
    platform: macOS
    sources:
      - path: Armadale
        excludes:
          - Resources/armadale-notify
      # The notify helper agents' hooks can run (docs/DESIGN.md section 10):
      # Contents/Resources/armadale-notify, a POSIX sh script (executable).
      - path: Armadale/Resources/armadale-notify
        buildPhase: resources
    # Armadale/Resources/Acknowledgements.txt (Help › Acknowledgements, the
    # third-party notices) is a resource by its extension:
    # Contents/Resources/Acknowledgements.txt.
    info:
      path: Armadale/Resources/Info.plist
      properties:
        CFBundleDisplayName: Armadale
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright © 2026 Donny Kurniawan.\nMIT License."
        NSPrincipalClass: ArmadaleApplication
        # Quitting must go through applicationWillTerminate so state is saved.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Tabs and tab groups dragged in the tab bar and the sidebar
        # (Armadale/Support/HierarchyDragItem.swift), and favorites dragged
        # in the New Session chooser (Armadale/Support/FavoriteDragItem.swift).
        # Private to the app.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tinylittleapps.armadale.hierarchy-item
            UTTypeDescription: Armadale tab or tab group
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.tinylittleapps.armadale.favorite
            UTTypeDescription: Armadale favorite
            UTTypeConformsTo:
              - public.data
        # The updater (docs/DESIGN.md section 8, "Updates"). The feed is
        # compiled into every build that ships, so it lives on the owner's
        # domain (docs/appcast.xml). The DMG's EdDSA signature is checked
        # before it is mounted. Nothing is downloaded or installed without
        # the user (no SUAllowsAutomaticUpdates); no SUEnableAutomaticChecks,
        # so Sparkle asks once, at the second launch; no
        # SUEnableSystemProfiling, so a check sends no system profile
        # (scripts/release.sh refuses a build that has it).
        SUFeedURL: https://armadale.dev/appcast.xml
        SUVerifyUpdateBeforeExtraction: true
        SUAllowsAutomaticUpdates: false
        # The public half of the update signing key (keychain account
        # `armadale`, README "Releasing"). Without it the updater never
        # starts and scripts/release.sh refuses to build. Installed copies
        # accept only updates signed with its private half, so leave it as
        # it is (docs/DESIGN.md section 13, "The update key").
        SUPublicEDKey: in0F6WnhaRwJKjq/X2e8QccvqOKNBwlniNy3voutwNo=
    # No App Sandbox, by design (docs/DESIGN.md, "Distribution"): Armadale
    # spawns the user's login shell and arbitrary agents with full access to
    # their files, runs a private zmx helper copied to
    # ~/Library/Application Support/Armadale/bin, and drives the user's own
    # `ssh` with their ~/.ssh config, keys and agent. None of that works
    # inside the sandbox. Distribution is Developer ID + notarization with the
    # hardened runtime instead.
    entitlements:
      path: Armadale/Resources/Armadale.entitlements
      properties:
        com.apple.security.app-sandbox: false
    # Bundles zmx before the Copy Files phases (docs/DESIGN.md section 4,
    # "Bundling"): a universal Contents/Helpers/zmx re-signed like ctty-exec,
    # and the Linux builds as data in Contents/Resources/remote/. Verifies
    # Vendor/zmx against scripts/zmx.lock first (fetching it if needed).
    preBuildScripts:
      - name: Embed zmx
        script: '"${SRCROOT}/scripts/embed-zmx.sh"'
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/scripts/embed-zmx.sh
          - $(SRCROOT)/scripts/fetch-zmx.sh
          - $(SRCROOT)/scripts/zmx.lock
          - $(SRCROOT)/Vendor/zmx/macos-aarch64/zmx
          - $(SRCROOT)/Vendor/zmx/macos-x86_64/zmx
          - $(SRCROOT)/Vendor/zmx/linux-aarch64/zmx
          - $(SRCROOT)/Vendor/zmx/linux-x86_64/zmx
        outputFiles:
          - $(DERIVED_FILE_DIR)/zmx
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/zmx
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remote/zmx-linux-aarch64
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/remote/zmx-linux-x86_64
    # After every other phase (so after the app is linked against the
    # framework Xcode extracted from the package into BUILT_PRODUCTS_DIR),
    # before Xcode signs the app (docs/DESIGN.md section 11, "Release
    # pipeline"): embeds Sparkle.framework in Contents/Frameworks without
    # its headers, modules and XPC services (Armadale is not sandboxed),
    # and re-signs Autoupdate, Updater.app and then the framework with the
    # build's identity, so a Debug bundle has the shape of a Release one.
    # Xcode's own embed of a package framework is not used: it is not a
    # build phase, so nothing orders a script after it (the two were seen
    # running at the same time, and no declared input changed that); its
    # sign-on-copy does not re-sign the code inside the framework; and
    # scripts/release.sh takes the app from the archive without exporting
    # it. Runs on every build: what it writes is inside the app.
    postBuildScripts:
      - name: Embed Sparkle
        script: '"${SRCROOT}/scripts/embed-sparkle.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/scripts/embed-sparkle.sh
          - $(BUILT_PRODUCTS_DIR)/Sparkle.framework
    dependencies:
      - package: ArmadaleCore
      - package: ArmadaleSessions
      - package: TerminalSurface
      - package: SwiftTermSurface
      # Built against, but not linked or embedded by Xcode (`link: false`):
      # `import Sparkle` links it by itself, and the "Embed Sparkle" phase
      # above embeds and signs it.
      - package: Sparkle
        link: false
      # Copy Files phase: Contents/Helpers/ctty-exec, re-signed on copy with
      # the app's identity (docs/DESIGN.md section 4, "Bundling").
      - target: ctty-exec
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Armadale
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale
        # App icon: Resources/AppIcon.icon (Icon Composer document, used on
        # macOS 26 and later) and the AppIcon set in Resources/Assets.xcassets
        # (rasters for everything else). Both are generated by
        # scripts/render-app-icon.swift; edit the script, not the files.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Neither script phase can run sandboxed: codesign writes a temporary
        # file next to what it signs ("Embed zmx" and "Embed Sparkle"), and
        # fetch-zmx.sh (when Vendor/zmx does not verify) downloads and
        # writes Vendor/zmx. Their inputs (and Embed zmx's outputs) are
        # still declared for dependency analysis.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 29
        # Signing (docs/DESIGN.md section 11, "Release pipeline"). Manual
        # style throughout, so Xcode never reaches for an account or a
        # provisioning profile. Debug is "Sign to Run Locally" (ad hoc), so
        # the build and test gate never needs the keychain; Xcode then turns
        # the hardened runtime off by itself. Release (what `xcodebuild
        # archive` and scripts/release.sh build) signs with the team's
        # Developer ID Application certificate, hardened runtime and a
        # secure timestamp, as notarization requires. The Embed zmx phase
        # and the sign-on-copy of ctty-exec follow this identity.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        # Our own code must be warning-free. Packages enable the same via
        # `.treatAllWarnings(as: .error)`; third-party SwiftTerm is not affected.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp

  # The trampoline that gives spawned sessions their controlling terminal
  # (docs/DESIGN.md section 7). Same source as the SwiftPM executable target
  # in Packages/ArmadaleSessions, which `swift test` uses.
  ctty-exec:
    type: tool
    platform: macOS
    sources:
      - path: Packages/ArmadaleSessions/Sources/ctty-exec
    settings:
      base:
        PRODUCT_NAME: ctty-exec
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale.ctty-exec
        # An Info.plist section in the binary gives the helper a stable code
        # signing identifier (its bundle ID) instead of a hash-suffixed name.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # No entitlements at all. Xcode would otherwise inject base
        # entitlements (get-task-allow) and, because it considers
        # entitlements required, com.apple.application-identifier: a restricted
        # entitlement that, without a provisioning profile, can make AMFI
        # refuse to launch the helper under Developer ID, so every session
        # would fail to start. Sign-on-copy preserves whatever is here.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENTITLEMENTS_REQUIRED: NO
        # Signed like the app (Debug ad hoc, Release Developer ID with the
        # hardened runtime and a timestamp); the sign-on-copy into
        # Contents/Helpers re-signs it with the app's identity and keeps
        # these flags.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          OTHER_CODE_SIGN_FLAGS: --timestamp

  # Tests for the app target's own code (split tree view, close-risk rule,
  # window controller lifetime). Unhosted on purpose: the app is never
  # launched, so no window appears, no state file is read or written, and no
  # session daemon is started. The app's sources are compiled into the
  # bundle instead (all but main.swift).
  ArmadaleAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ArmadaleAppTests
      - path: Armadale
        excludes:
          - App/main.swift
          # The one file that imports Sparkle (the test bundle does not link
          # it); everything else talks to the AppUpdater protocol.
          - App/SparkleUpdater.swift
          - Resources/**
      # The acknowledgements, so AcknowledgementsTests read them from a
      # bundle as the app does.
      - path: Armadale/Resources/Acknowledgements.txt
        buildPhase: resources
    dependencies:
      - package: ArmadaleCore
      - package: ArmadaleSessions
      - package: TerminalSurface
      - package: SwiftTermSurface
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinylittleapps.armadale.app-tests
        GENERATE_INFOPLIST_FILE: YES
        # Not the app's Info.plist (XcodeGen would pick it up from the
        # sources): its NSPrincipalClass makes xctest create a second
        # NSApplication.
        INFOPLIST_FILE: ""
        # Always ad hoc: the bundle is only ever built for the Debug test
        # run and never ships, so it never needs the keychain.
        DEVELOPMENT_TEAM: YJ8LXVCB3T
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES

schemes:
  Armadale:
    build:
      targets:
        Armadale: all
    run:
      config: Debug
      # Run in Xcode never shares the real state directory or settings with
      # an installed Armadale (docs/DESIGN.md section 8, "App lifecycle":
      # one process per state directory). Same values as README's
      # development runs.
      environmentVariables:
        ARMADALE_STATE_DIR: /tmp/armadale-dev
        ARMADALE_DEFAULTS_SUITE: armadale-dev
    test:
      config: Debug
      gatherCoverageData: false
      # Tests must not inherit the run action's environment above. XcodeGen
      # makes the test action reuse it ("Use the Run action's arguments and
      # environment variables") whenever the test action has none of its
      # own, so it gets one, disabled: nothing is passed to the tests.
      environmentVariables:
        - variable: ARMADALE_TEST_PLACEHOLDER
          value: unused
          isEnabled: false
      # Tests live in the local packages; this makes
      # `xcodebuild test -scheme Armadale` run all of them.
      targets:
        - ArmadaleAppTests
        - package: ArmadaleCore/ArmadaleCoreTests
        - package: ArmadaleSessions/ArmadaleSessionsTests
        - package: TerminalSurface/TerminalSurfaceTests
        - package: SwiftTermSurface/SwiftTermSurfaceTests
    archive:
      config: Release
